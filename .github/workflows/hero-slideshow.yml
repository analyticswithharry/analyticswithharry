name: Build hero slideshow
on:
  push:
    paths:
      - "img/hero/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Build GIF
        run: |
          python - <<'EOF'
          import glob, os, re
          from PIL import Image, ImageOps

          def num(p):
              return int(re.search(r"(\d+)", os.path.basename(p)).group(1))

          files = sorted(glob.glob("img/hero/hero-slide-*.jpg"), key=num)
          print("Slides:", files)

          W, H = 1200, 400
          HOLD_MS, FADE_STEPS, FADE_MS = 3000, 12, 60

          slides = [
              ImageOps.fit(Image.open(f).convert("RGB"), (W, H),
                           Image.LANCZOS, centering=(0.5, 0.5))
              for f in files
          ]

          frames, durations = [], []
          for i, cur in enumerate(slides):
              nxt = slides[(i + 1) % len(slides)]
              frames.append(cur)
              durations.append(HOLD_MS)
              for k in range(1, FADE_STEPS + 1):
                  frames.append(Image.blend(cur, nxt, k / (FADE_STEPS + 1)))
                  durations.append(FADE_MS)

          os.makedirs("assets", exist_ok=True)
          frames[0].save("assets/hero-slideshow.gif", save_all=True,
                         append_images=frames[1:], duration=durations,
                         loop=0, optimize=True)
          EOF
      - name: Commit GIF
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add assets/hero-slideshow.gif
          git diff --cached --quiet || git commit -m "Update hero slideshow"
          git push
